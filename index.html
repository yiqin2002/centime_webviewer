<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CT Slice Viewer</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 16px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta {
      color: #444;
      font-size: 14px;
    }

    input[type="range"] {
      width: min(720px, 92vw);
    }

    button {
      padding: 6px 10px;
    }

    .card {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 980px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .kv {
      padding: 8px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
    }

    .k {
      font-size: 12px;
      color: #666;
    }

    .v {
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
      word-break: break-word;
    }

    .image-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
      align-items: start;
    }

    .image-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .column-label {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      color: #222;
      margin-bottom: 2px;
    }

    .method-label {
      display: none;
      font-size: 14px;
      color: #444;
      text-align: center;
    }

    .show-method-labels .method-label {
      display: block;
    }

    .image-panel img {
      width: 100%;
      height: auto;
      display: block;
      background: #111;
      border-radius: 8px;
    }

    @media (max-width: 1200px) {
      .image-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .image-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>CT Slice Viewer</h1>

  <div class="controls">
    <label>
      Patient:
      <select id="patient"></select>
    </label>

    <label>
      Direction:
      <select id="dir">
        <option value="slices_x">X</option>
        <option value="slices_y">Y</option>
        <option value="slices_z">Z</option>
      </select>
    </label>

    <label>
      Slice:
      <input id="slice" type="range" min="0" max="479" value="0" />
    </label>

    <label>
      <input id="toggle-method-labels" type="checkbox" />
      Show method labels
    </label>

    <span id="label" class="meta"></span>

    <button id="prev">◀</button>
    <button id="next">▶</button>
  </div>

  <div class="card">
    <div class="meta">Clinical features</div>

    <div class="grid">
      <div class="kv">
        <div class="k">Patient ID</div>
        <div class="v" id="feat-id">—</div>
      </div>

      <div class="kv">
        <div class="k">Censored</div>
        <div class="v" id="feat-censored">—</div>
      </div>

      <div class="kv">
        <div class="k">Time to event</div>
        <div class="v" id="feat-tti">—</div>
      </div>
    </div>
  </div>

  <p id="status" class="meta"></p>

  <div id="image-row" class="image-row">
    <div class="image-panel">
      <div class="column-label">Centime</div>
      <div id="method-label-1" class="method-label">method_1</div>
      <img id="img1" alt="Column A" />
    </div>

    <div class="image-panel">
      <div class="column-label">EigenCAM</div>
      <div id="method-label-2" class="method-label">method_2</div>
      <img id="img2" alt="Column B" />
    </div>

    <div class="image-panel">
      <div class="column-label">C</div>
      <div id="method-label-3" class="method-label">EigenCAM</div>
      <img id="img3" alt="Column C" />
    </div>

    <div class="image-panel">
      <div class="column-label">Centime(Beta0)</div>
      <div id="method-label-4" class="method-label">method_4</div>
      <img id="img4" alt="Column D" />
    </div>

    <div class="image-panel">
      <div class="column-label">EigenCAM(Beta0)</div>
      <div id="method-label-5" class="method-label">method_5</div>
      <img id="img5" alt="Column E" />
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
